  --step-1:1.0625rem;
  --step-2:clamp(1.375rem, 5.6vw, 1.625rem);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1A29;
    --surface:#16263A;
    --ink:#E8F0F8;
    --muted:#93A6BC;
    --line:#27394F;
    --btn-fill:#E8F0F8;
    --btn-fill-ink:#12243A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -14px rgba(0,0,0,.6);
    --logo-light:none;
    --logo-dark:inline;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1A29;
  --surface:#16263A;
  --ink:#E8F0F8;
  --muted:#93A6BC;
  --line:#27394F;
  --btn-fill:#E8F0F8;
  --btn-fill-ink:#12243A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -14px rgba(0,0,0,.6);
  --logo-light:none;
  --logo-dark:inline;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 20px 32px;
  background:var(--ground);
  color:var(--ink);
  font-family:'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size:var(--step-0);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

.sheet{
  width:100%;
  max-width:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
  text-align:center;
}
.sheet > *{max-width:100%}   /* колонка центрируется по контенту — держим её в берегах */

.logo{width:196px;height:auto;display:block}
.logo--light{display:var(--logo-light)}
.logo--dark{display:var(--logo-dark)}

.words{display:flex;flex-direction:column;gap:8px}

h1{
  margin:0;
  font-size:var(--step-2);
  font-weight:900;
  line-height:1.2;
  letter-spacing:-.015em;
  text-wrap:balance;
}
.lead{margin:0;color:var(--muted);text-wrap:balance}

.choice{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.pick{
  margin:0 0 2px;
  font-size:.75rem;
  font-weight:600;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--muted);
}

.btn{
  display:flex;
  align-items:center;
  gap:14px;
  min-height:62px;
  padding:0 20px;
  border-radius:14px;
  border:1px solid transparent;
  font:inherit;
  font-size:var(--step-1);
  font-weight:600;
  text-decoration:none;
  color:var(--btn-fill-ink);
  background:var(--btn-fill);
  transition:transform .12s ease, box-shadow .18s ease, border-color .18s ease;
  box-shadow:var(--shadow);
}
.btn--outline{
  background:var(--surface);
  color:var(--ink);
  border-color:var(--line);
}
.btn:hover{box-shadow:0 2px 4px rgba(32,59,91,.08), 0 18px 40px -14px rgba(32,59,91,.3)}
.btn--outline:hover{border-color:var(--sky)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

.pin{flex:none;width:26px;height:26px}
.btn__label{flex:1;text-align:left}
.btn__arrow{flex:none;opacity:.45}

.note{
  margin:0;
  font-size:.875rem;
  line-height:1.55;
  color:var(--muted);
  text-wrap:pretty;
}
.note a{color:var(--sky);text-decoration:none;border-bottom:1px solid rgba(0,148,217,.45)}
.note a:hover{border-bottom-color:var(--sky)}
.note a:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:3px}

/* появление: один заход сверху вниз, без россыпи эффектов */
@media (prefers-reduced-motion: no-preference){
  .rise{animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards}
  .rise:nth-child(1),
  .rise:nth-child(2){animation-delay:.02s}   /* два логотипа занимают один шаг: видим всегда один */
  .rise:nth-child(3){animation-delay:.1s}
  .rise:nth-child(4){animation-delay:.18s}
  .rise:nth-child(5){animation-delay:.26s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>
